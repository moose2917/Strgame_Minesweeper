<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薩小遊戲之賀瓏夜夜秀踩地雷</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="image/TNNSS2_logo.png" alt="TNNS Banner">
  </header>

  <main>
    <section class="info-section">
      <h1>薩小遊戲</h1>
      <h1>賀瓏踩地雷</h1>
      <h3>賀粉們！第二季一樣很危險</h3>
      <h3>大家一起協力找出地雷</h3>
      <h3>保護賀瓏不要被炎上</h3>
    </section>

    <section class="input-section">
        <div class="input-wrapper">
            <input type="text" id="playerName" placeholder="請輸入你的名字" maxlength="10">
            <p id="nameError" class="error-message"></p>
        </div>
    </section>
    
    <section class="start-btn-section">
      <button id="startGameBtn" class="start-btn">開始遊戲</button>
    </section>
  </main>

  <footer>
    <p>Copyright @ 2025 STR NETWORK All Rights Reserved.</p>
  </footer>

  <div id="rankingModal" class="ranking-modal" style="display: none;">
    <div class="ranking-content">
        <h2>排行榜</h2>
        <table id="rankingTable">
            <thead>
                <tr>
                    <th>排名</th>
                    <th>玩家</th>
                    <th>時間</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button class="close-ranking-btn">關閉</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyB_6LGDvxrWBmGEJcz1ApJZ-LYkzWuKWNI",
    authDomain: "minesweeper-8b1d8.firebaseapp.com",
    projectId: "minesweeper-8b1d8",
    storageBucket: "minesweeper-8b1d8.firebasestorage.app",
    messagingSenderId: "452832722282",
    appId: "1:452832722282:web:d1708cbf1daa804ec03913",
    measurementId: "G-GGSZTMJ7GQ"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  </script>

  <script src="script.js"></script>
  <div id="adContainer" style="display: none;">
    <video id="adVideo" class="ad-video" playsinline>
      <source src="video/賀博短廣告_現正熱映_720p.mov" type="video/quicktime">
    </video>
    <div class="volume-hint">🔊</div>
    <button id="skipAdButton" class="skip-ad-btn" style="display: none;">跳過廣告</button>
  </div>
</body>
</html>
